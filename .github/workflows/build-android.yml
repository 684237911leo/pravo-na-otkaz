name: Build Android APK

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          sed -i "s|KEYSTORE_PATH|$GITHUB_WORKSPACE/debug.keystore|g" export_presets.cfg

      - name: Install Godot and templates
        run: |
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot || sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "/usr/local/lib/android/sdk"\nexport/android/java_sdk_path = "%s"\n' "$JAVA_HOME" > ~/.config/godot/editor_settings-4.tres

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/pravo-na-otkaz.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pravo-na-otkaz-apk
          path: build/pravo-na-otkaz.apk
